<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EditPro AI - Mobile Video Editor</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
        }
        .container {
            max-width: 400px;
            margin: 30px auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input[type="file"] {
            margin: 20px 0;
            color: #fff;
            max-width: 100%;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            background: #000;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>EditPro AI</h1>
        <p>Apna video upload karein aur browse karein:</p>
        <input type="file" id="videoUpload" accept="video/*">
        <br>
        <video id="videoPlayer" controls style="display:none;"></video>
    </div>
    <script>
        const videoUpload = document.getElementById('videoUpload');
        const videoPlayer = document.getElementById('videoPlayer');
        let previousURL;
        videoUpload.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (previousURL) URL.revokeObjectURL(previousURL);
            if (file) {
                previousURL = URL.createObjectURL(file);
                videoPlayer.src = previousURL;
                videoPlayer.style.display = 'block';
            } else {
                videoPlayer.removeAttribute('src');
                videoPlayer.style.display = 'none';
            }
        });
    </script>
</body>
</html>
